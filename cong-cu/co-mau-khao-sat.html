<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Máy tính cỡ mẫu khảo sát — HuyData Thống kê</title>
<style>
:root{--g:#168F6F;--gd:#0E5C4A;--ink:#1A2E1F;--mut:#5b6b60;--line:#e2e8e4;--bg:#FDFCF8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding:26px}
.box{max-width:520px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px}
h1{font-size:22px;color:var(--gd);margin-bottom:4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:22px}
label{display:block;font-size:13.5px;font-weight:600;margin:16px 0 6px}
input,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.hint{font-size:12px;color:var(--mut);margin-top:5px}
.out{margin-top:24px;background:#EAF7F1;border:1px solid #bfe6d5;border-radius:14px;padding:20px;text-align:center}
.out .n{font-size:40px;font-weight:700;color:var(--gd);line-height:1}
.out .lbl{font-size:13px;color:var(--mut);margin-top:6px}
.foot{margin-top:20px;font-size:12px;color:var(--mut);text-align:center}
.foot a{color:var(--g)}
</style>

<div class="box">
  <h1>Máy tính cỡ mẫu khảo sát</h1>
  <p class="sub">Xác định số phiếu cần thu để kết quả đủ tin cậy.</p>
  <label>Quy mô tổng thể (N)</label>
  <input id="N" type="number" min="1" value="10000">
  <div class="hint">Tổng số đối tượng. Không rõ thì để số lớn (vd 100000).</div>
  <label>Độ tin cậy</label>
  <select id="cl"><option value="1.645">90%</option><option value="1.96" selected="">95%</option><option value="2.576">99%</option></select>
  <label>Sai số cho phép (e)</label>
  <select id="e"><option value="0.03">± 3%</option><option value="0.05" selected="">± 5%</option><option value="0.10">± 10%</option></select>
  <label>Tỷ lệ ước lượng (p)</label>
  <input id="p" type="number" min="0.01" max="0.99" step="0.01" value="0.5">
  <div class="hint">Không rõ thì để 0.5 (cho cỡ mẫu lớn nhất, an toàn nhất).</div>
  <div class="out"><div class="n" id="result">—</div><div class="lbl">phiếu cần khảo sát (tối thiểu)</div></div>
  <p class="foot">Công thức Cochran có hiệu chỉnh tổng thể hữu hạn · <a href="https://thongke.huydata.vn/" target="_blank" rel="noopener">HuyData Thống kê</a></p>
</div>
<script>
function calc(){
  var N=+document.getElementById('N').value||0;
  var z=+document.getElementById('cl').value;
  var e=+document.getElementById('e').value;
  var p=Math.min(0.99,Math.max(0.01,+document.getElementById('p').value||0.5));
  var n0=(z*z*p*(1-p))/(e*e);
  var n=(N>0)?(n0/(1+(n0-1)/N)):n0;
  document.getElementById('result').textContent=isFinite(n)?Math.ceil(n).toLocaleString('vi-VN'):'—';
}
document.querySelectorAll('input,select').forEach(function(el){el.addEventListener('input',calc);});
calc();
</script>
